name: Send notifications

# Every 10 minutes (GitHub often starts these a few minutes late, so a reminder can arrive a little after its time).
# Run it by hand from the Actions tab to send a test push to yourself or to do a dry run.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_username:
        description: 'Send ONE test push to every phone signed in as this username (leave empty for a normal pass)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: print what would be sent, send and save nothing'
        type: boolean
        required: false
        default: false

# One pass at a time: a slow run never overlaps the next one.
concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only used by the keep-alive step at the bottom

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_USERNAME: ${{ github.event.inputs.test_username }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry"; fi
          if [ -n "$TEST_USERNAME" ]; then
            node send.js $args --ping "$TEST_USERNAME"
          else
            node send.js $args
          fi

      # GitHub switches scheduled jobs off in a public repo after 60 days with no activity. Calling the "enable workflow" API
      # on a workflow that is already enabled counts as activity and resets that clock, so the job keeps itself alive.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/notify.yml/enable"
